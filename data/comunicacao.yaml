# Regua de comunicacao do Plasticflix Prime.
#
# O que esta aqui saiu do kickoff. Mote, manifesto e regua de tom NAO sairam -
# o kickoff nao tocou nesse ponto - e por isso aparecem como null.
#
# Fonte: kickoff 2026-09-22.

fonte: kickoff 2026-09-22

idioma:
  # REVERTIDO em 24/09/2026 por decisao da Daniela Cabral: a comunicacao sai em
  # portugues. O ingles cai.
  #
  # Este campo e lido pela regra R-004, que nao tem idioma hardcoded — mudar
  # aqui muda o veredito do verificador sem tocar em uma linha de codigo. Era
  # exatamente para este tipo de reversao que o desenho foi feito.
  publico: pt-BR
  decidido_por: Daniela Cabral (Stark)
  decidido_em: 2026-09-24
  historico:
    - decisao: ingles
      por: Dr. Fernando Mattioli
      em: 2026-09-22 (kickoff)
      justificativa: >
        Os convidados sao americanos e turcos, e o publico latino-americano de
        alto padrao consome conteudo internacional com traducao simultanea.
      contra_proposta_recusada: espanhol
      status: revertida
    - decisao: portugues
      por: Daniela Cabral
      em: 2026-09-24
      status: vigente
  atencao_ao_cliente: >
    A reversao CONTRARIA uma decisao explicita do decisor do cliente, tomada no
    kickoff com justificativa propria. Avisar o Dr. Mattioli antes que ele veja
    uma peca em portugues — a conversa e muito melhor antes do que depois.
  aplica_a: [instagram, anuncio, landing_page]
  excecoes:
    - canal: whatsapp
      idioma: idioma do lead
      nota: atendimento direto fala a lingua de quem esta do outro lado
    - canal: interno
      idioma: pt-BR
      nota: material de time e de cliente nao e peca publica
  contra_hipotese:
    status: aberta
    descricao: >
      Ingles para publico latino e decisao do cliente, mas e hipotese nao
      testada. Medir desempenho POR PRACA (Mexico e Argentina separados) e
      reabrir a conversa com dado se uma delas performar mal. Nao reabrir por
      argumento.

eixo:
  big_idea: >
    O Prime coloca o cirurgiao operando ao lado de quem ele so ve em congresso -
    instrutor individual por peca anatomica, aula teorica com os mesmos nomes e
    cirurgia ao vivo na mesma semana.
  forma: afirmativa
  nota: >
    Afirmativa, nao interrogativa e nao comparativa. O eixo declara o que o
    evento E, nao o que os outros nao sao.

provas:
  - id: PR-001
    nome: Proporcao de supervisao
    afirmacao: 1 aluno por peca na Rinoplastia, 2 alunos por peca na Face
    forca: mais forte e mais facil de defender
    origem: >
      Ponto levantado pela Gislaine e reivindicado pelo Mattioli como metodo.
    lastro: data/perfil-plasticflix.yaml, evento.grade
  - id: PR-002
    nome: Corpo docente internacional
    afirmacao: >
      Dr. Cercan (Turquia) na Rinoplastia e tres convidados americanos na Face,
      lado a lado com os socios.
    lastro: data/perfil-plasticflix.yaml, estrutura_societaria.eixos
    pendencia: >
      Os nomes dos tres americanos nao foram ditos. Nao nomear ninguem que nao
      esteja no perfil. Ver lacunas.yaml L-005.
  - id: PR-003
    nome: Semana completa e encadeada
    afirmacao: >
      Teoria -> anatomia -> cirurgia ao vivo, no mesmo lugar, com a mesma turma.
    lastro: data/perfil-plasticflix.yaml, evento.grade

cadencia:
  posts_por_semana_minimo: 3
  canal: instagram
  idioma: pt-BR
  linhas_ja_pedidas:
    - Carrosseis de apresentacao dos palestrantes
    - Diferenciais cientificos
    - Instrutor individual por aluno
    - Encadeamento teoria -> lab -> cirurgia

funil:
  instagram:
    papel: etapa intermediaria
    nao_e: vitrine
    funcao: >
      E onde a objecao cai e o corpo docente e apresentado. Posicao defendida
      pelo Gustavo. O cliente queria mandar o anuncio direto para a LP.
    acordo: manter o Instagram no percurso e provar com dado no primeiro ciclo
    risco: >
      Anuncio direto para LP num produto de R$ 20 a 60 mil tende a nao
      converter. Ver regra R-008 (alerta, sem veto).
  percurso_declarado:
    - anuncio ou conteudo
    - instagram
    - landing page
    - whatsapp
    - qualificacao (RQE ou residencia)
    - proposta
    - link de pagamento

termos_proibidos:
  - termo: transmissao ao vivo da cirurgia
    motivo: decisao fechada de nao transmitir; ver regra R-002
  - termo: live surgery streaming
    motivo: mesma decisao, em ingles
  - termo: assista de onde estiver
    motivo: sugere transmissao remota da cirurgia
  - termo: aberto a todos os medicos
    motivo: viola o gate de elegibilidade; ver regra R-001
  - termo: promocao
    motivo: preco so muda por lote, nunca por promocao; ver regra R-005
  - termo: desconto relampago
    motivo: idem
  - termo: resultado garantido
    motivo: promessa de resultado ao medico-aluno; ver regra R-006
  - termo: dominio da tecnica
    motivo: promete formacao completa em uma semana; ver regra R-006
  - termo: o melhor curso do mundo
    motivo: superlativo sem lastro; ver regra R-006

anti_padroes:
  - Corte publico de valor. O preco muda por lote, e a justificativa ao lead e sempre a regra de lote.
  - Preco diferente em LP, WhatsApp e comercial. Foi o que gerou o R$ 20 mil x R$ 25 mil relatado pela Fran.
  - Nomear hospital, ano ou data de virada de lote antes de o dado existir nos YAMLs.
  - Anuncio de lab apontando direto para LP, sem etapa intermediaria.
  - Peca publica fora do idioma vigente em comunicacao.yaml (hoje pt-BR).
  - Prometer vaga ou inscricao antes da conferencia de RQE ou residencia.
  - Citar o piso negociado da Face (R$ 50 mil ou R$ 40 mil) em qualquer peca publica.

# VIGENTES: continuam null de proposito. Existem propostas (abaixo), nenhuma
# aprovada. A L-013 so fecha quando o Dr. Mattioli aprovar. Ate la NENHUMA peca
# usa assinatura de campanha — as tres provas sustentam a cadencia sem ela.
mote: null
manifesto: null
regua_de_tom: null

ideacao:
  status: propostas prontas, aguardando aprovacao do cliente
  produzida_em: 2026-09-24
  clickup: 86akpfjh7

  posicionamento:
    metodo: Dunford
    categoria_escolhida: Semana de imersao cirurgica supervisionada em rinoplastia e face
    estrategia_de_categoria: big fish, small pond
    razao_da_categoria: >
      A Face a R$ 60 mil nao tem objecao de PRECO, tem objecao de CATEGORIA.
      Dentro de "curso de cadaver" — que o proprio cliente diz estar saturado e
      barato — o valor e absurdo. Dentro de "imersao supervisionada", ancorada
      em fellowship e observership, entra na conversa. Nao criar categoria nova
      (caro e lento) e nao competir de frente no curso de cadaver (e perder pelo
      preco antes de comecar).
    statement: >
      Para o cirurgiao plastico, otorrinolaringologista ou residente formal que
      JA VIU a tecnica e ainda nao a executou com seguranca, o Plasticflix Prime
      e uma semana de imersao cirurgica supervisionada em rinoplastia e face que
      coloca a peca anatomica sob a mao dele com instrutor dedicado, e encadeia
      teoria, anatomia e cirurgia ao vivo na mesma semana e com a mesma turma.
      Diferente das alternativas disponiveis, a proporcao e de 1 aluno por peca
      na Rinoplastia e 2 na Face, com docentes internacionais ao lado dos socios.
    alternativas_competitivas:
      - id: A1
        o_que: Curso de cadaver avulso de sociedade ou servico universitario
        tipo: direta
        nota: e a alternativa que envenena o preco — origem da objecao da Face
      - id: A2
        o_que: Congresso e jornada
        tipo: adjacente
      - id: A3
        o_que: Fellowship ou observership no exterior
        tipo: adjacente
        lastro: HIPOTESE
      - id: A4
        o_que: Preceptoria informal com mentor conhecido
        tipo: DIY
        lastro: HIPOTESE
      - id: A5
        o_que: A propria plataforma online das tercas, da Neo ID
        tipo: adjacente
        nota: >
          A alternativa mais desconfortavel do projeto: o proprio cliente a
          opera. Se a comunicacao disser "aprenda a tecnica X com o Dr. Y", a
          resposta racional do cirurgiao e "ja vejo isso na terca". O Prime tem
          de vender o que a terca NAO entrega. Resolvido pela categoria: a
          terca e AULA, o Prime e IMERSAO.
      - id: A6
        o_que: Nao fazer nada, aprender pela propria casuistica
        tipo: status quo
        nota: quase sempre a alternativa mais forte
    temas_de_valor_em_ordem_de_forca:
      - Execucao supervisionada (o mais forte, e o unico que nenhuma alternativa copia sem mudar a propria economia)
      - Acesso direto ao docente
      - Encadeamento
    inversao_recomendada: >
      A cadencia hoje tende a liderar por CORPO DOCENTE (carrosseis de
      palestrantes). Corpo docente e a prova mais bonita e o valor mais fraco —
      e justamente o que congresso e fellowship tambem oferecem. Liderar por ele
      coloca o Prime na briga errada. A SUPERVISAO lidera; o docente sustenta.
    gate_de_rqe_como_atributo: >
      O cliente trata o gate como defesa juridica. Ele tambem e atributo de
      produto: sala so de titulados muda o nivel da discussao dentro do lab.
      HIPOTESE derivada do dado — vale testar com 3 ou 4 dos 22 leads antes de
      virar mensagem.

  # LEVANTADO EM 24/09, DEPOIS da ideacao — e contradiz parte dela.
  tom_vigente_do_cliente:
    levantado_em: 2026-09-24
    fontes: [instagram @plasticflixbrasil, plasticflixacademy.com.br, plasticflix.academy]
    exemplos_literais:
      - "Seu Passaporte para a Excelencia em Rinoplastia e Cirurgia Facial!"
      - "Uma imersao que entrega: maestria, confianca e tecnica."
      - "Aprenda com quem dita o ritmo da evolucao na cirurgia plastica facial."
      - "A MAIOR PLATAFORMA DE CIRURGIA PLASTICA FACIAL E RINOPLASTIA DO MUNDO"
    persona_do_cliente:
      onde: Doc "Persona | Plasticflix" no Drive
      framework: EJACA
      nota: >
        A quinta etapa do EJACA e "apontar a culpa para seus inimigos", com
        falas como "o mercado esta cheio de gente que finge saber o que faz".
        O eixo que produzimos e afirmativo e SEM INIMIGO.
    conflito: >
      O tom vigente do cliente e superlativo e de promessa. A regua de tom que
      produzimos bane exatamente isso: numero no lugar do adjetivo, sem
      promessa de dominio, sem superlativo sem lastro.
      Nao e detalhe de estilo — e a diferenca entre a campanha soar como o
      cliente ou soar como outra marca.
    decisao_necessaria: >
      Ou a Stark aproxima do registro que a audiencia ja reconhece, ou propoe a
      mudanca DECLARANDO que e mudanca e a defende na reuniao. O que nao pode e
      entregar peca em tom novo sem avisar — foi assim que a OpenMind teve 40
      pecas reprovadas.
    o_que_falta: >
      Ler 20 a 30 LEGENDAS reais do perfil (nao os cartazes), identificar o que
      performa, e ver como o cliente fala do cadaver lab especificamente.
      ClickUp 86akpfrj2.

  ideia_de_controle: >
    Cirurgiao aprende operando. Por isso o Prime conta peca, e nao plateia.

  tensao: >
    O leitor tem duas verdades ao mesmo tempo, e as duas sao dele: ja sabe
    operar, e a tecnica que quer incorporar viu de longe. A tensao nao se
    resolve com argumento — ela se sustenta. Nenhuma peca deve tentar fecha-la
    com frase de efeito.

  arco:
    - ato: I
      nome: O reconhecimento
      valor: mais curriculo -> menos lacuna
      prova: PR-001 em estado de pergunta
      comunica: >
        O custo de assistir, pela aritmetica que o proprio leitor faz sozinho.
        A peca da o numero do Prime e cala.
    - ato: II
      nome: A estrutura
      valor: menos lacuna -> mais estrutura conhecida
      prova: [PR-001, PR-003, PR-002]
      comunica: >
        Como o evento esta montado, em detalhe verificavel. Linguagem quase de
        grade. Nenhum adjetivo sobrevive a este ato.
      virada: >
        O leitor para de avaliar "se vale a pena ir" e passa a avaliar "se eu
        caibo".
    - ato: III
      nome: A escolha sob pressao
      valor: estrutura -> decisao, com custo
      prova: vaga e elegibilidade
      comunica: >
        A vaga, que e a mesma proporcao do Ato II vista do outro lado. O gate de
        RQE entra como carater da marca, nao como burocracia. E o custo real —
        cinco dias de agenda bloqueada — nao e escondido.
      nota: >
        Prazo de lote entra aqui QUANDO existir (L-004). Ate la o ato roda
        inteiro na vaga, que nao depende de data.

  arco_resultado: >
    Muda de quem e a pergunta: entra como "esse evento e bom?" e sai como "eu
    caibo nessa turma?". Campanha que nao faz essa inversao vendeu ingresso,
    nao vaga.

  motes_propostos:
    - id: A
      texto: Uma peca. Um cirurgiao.
      tese: a proporcao e o produto
      abre_mao: >
        Nao sobrevive na Face, onde sao 2 por peca. Assinatura que precisa ser
        reescrita por eixo nao e assinatura de campanha.
      uso_sugerido: assinatura do lab de Rinoplastia
    - id: B
      texto: Da teoria a sala, na mesma semana.
      tese: o encadeamento e o que nao se compra separado
      abre_mao: a proporcao sai da assinatura e volta na primeira linha do corpo
      recomendado: true
      razao: >
        Unica que serve Rinoplastia e Face sem diferenca, cobre os tres
        produtos, sustenta o combo do rodape das LPs e nao depende de nenhum
        campo pendente.
    - id: D
      texto: A sua mao em cada etapa.
      origem: agente estrategico (metodo Dunford + Neumeier)
      tese: >
        Carrega as tres provas de uma vez: "sua mao" e a proporcao (PR-001),
        "cada etapa" e a semana encadeada (PR-003), e PR-002 entra como o quem
        esta do outro lado.
      abre_mao: nada estrutural — e a unica que cobre supervisao E encadeamento
      recomendado_por_estrategia: true
      razao: >
        Verdadeira nos dois eixos sem nota de rodape, nao promete desfecho
        (R-006), nao sugere assistir de longe (R-002), nao depende de nenhum
        campo pendente (R-007), e desqualifica sozinha quem quer so certificado.
    - id: C
      texto: A vaga e contada.
      tese: escassez estrutural sem teatro
      abre_mao: >
        Fala de disponibilidade e nao de metodo, e o leitor compra metodo.
        Arrisca ler como contagem regressiva, sendo que prazo de lote nao existe.

  regua_de_tom_proposta:
    - regra: Numero no lugar do adjetivo, sempre
      nasceu_de: '"supervisao de excelencia" nao prova nada; "1 aluno por peca" prova'
    - regra: Colega, nao palanque, e nunca paciente
      nasceu_de: o reflexo da carteira de leigos da Stark
    - regra: O que nao fazemos entra na peca, dito de frente
      nasceu_de: o silencio sobre a transmissao vira problema no WhatsApp
    - regra: Sem promessa de resultado, retorno ou dominio
      nasceu_de: '"domine a tecnica" reprova em R-006 e soa a curso barato'
    - regra: Preco so se move por lote, com prazo declarado
      nasceu_de: a objecao real do R$ 20 mil x R$ 25 mil relatada pela Fran
    - regra: Uma peca, uma prova
      nasceu_de: o carrossel que empilha os tres diferenciais nao fixa nenhum
    - regra: Campo vazio e campo vazio
      nasceu_de: completar ano, hospital ou nome de convidado "porque e obvio"

  convergencia_dos_dois_agentes: >
    Estrategia e copy chegaram separadamente a mesma eliminacao: "Uma peca. Um
    cirurgiao." cai porque so e literal na Rino e mente na Face — que e o eixo
    que mede o projeto. Divergem no que sobe: a copy recomenda B (encadeamento),
    a estrategia recomenda D (supervisao + encadeamento). D subsume B; B e mais
    concreta. Decisao de marca, nao tecnica — vai a mesa com as duas.

  banco_de_hooks:
    total: 16
    onde: ClickUp 86akpfkhg e scratchpad/ideacao-narrativa.md
    regra: nenhum hook afirma ano, hospital, numero da edicao, data de lote ou nome nao confirmado
pendencia_de_marca: >
  Mote/assinatura de campanha, manifesto e regua de tom NAO foram discutidos no
  kickoff. Proposta registrada: derivar do eixo acima e levar ao Mattioli junto
  com as duas LPs. Ate la, nenhuma peca deve usar assinatura de campanha - nao
  existe uma aprovada.
