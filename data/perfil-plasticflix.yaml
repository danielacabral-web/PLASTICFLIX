# Perfil do projeto Plasticflix Prime.
#
# Fonte unica: kickoff de 22/09/2026 (gravacao + transcricao integral) e o plano
# de projeto derivado dele. Nada aqui foi estimado: o que o kickoff nao
# estabeleceu esta como null, com nota dizendo o que falta confirmar.
#
# O cliente e o Plasticflix (5o episodio). A organizacao executiva e da Cenacon.

slug: plasticflix
nome_projeto: Plasticflix Prime
edicao: 5o episodio
fonte: kickoff 2026-09-22
levantamento: 2026-09-22

estrutura_societaria:
  cnpj: unico
  observacao: >
    Os socios operam sob CNPJ unico. O comando e dividido didaticamente por
    eixo (rinoplastia e face), nao por pessoa juridica.
  eixos:
    - eixo: rinoplastia
      socios: [Dr. Frederico Ken, Dr. Sergio Furtado, Dr. Manuel Pereira]
      convidado_internacional:
        - nome: Dr. Cercan
          pais: Turquia
    - eixo: face
      socios: [Dr. Fernando Mattioli, Dr. Valdemar Pena]
      convidado_internacional:
        - nome: null
          pais: EUA
          quantidade: 3
          nota: >
            O kickoff diz apenas "tres convidados americanos" na face. Nomes nao
            foram ditos. Confirmar com o cliente antes de qualquer peca de corpo
            docente.

organizacao:
  empresa: Cenacon
  responsavel: Gislaine
  papel: dona e coordenadora da organizacao executiva

ativos_existentes:
  plataforma_online:
    descricao: >
      Plataforma de aulas online semanais, as tercas, dividida entre
      rinoplastia e face. Serve de aquecimento e engajamento para o presencial.
    periodicidade: semanal_tercas
    mantida_por: Neo ID
  instagram:
    handle: "@plasticflixbrasil"
    seguidores: 12100
    posts: 602
    bio_em_24_09_2026: >
      Plasticflix Academy - Hands on Cadaver Lab Face/Nariz: 03-07 marco 2027
      Sao Paulo/ inscricoes abertas : +55 11 981047813
    nota: >
      INSCRICOES JA ESTAO ABERTAS e anunciadas publicamente, com telefone
      proprio. O calendario do projeto previa lote 1 so em dez/jan — o cliente
      ja esta vendendo.
  site_do_evento:
    url: plasticflixacademy.com.br
    estado: no ar com a pagina PRIME 2027
    tom_vigente:
      - "Seu Passaporte para a Excelencia em Rinoplastia e Cirurgia Facial!"
      - "Uma imersao que entrega: maestria, confianca e tecnica."
      - "Aprenda com quem dita o ritmo da evolucao na cirurgia plastica facial."
    precos_publicados:
      hands_on_rino_mais_teoria: 20000
      hands_on_face_mais_teoria: 60000
      teoria_face: 10000
      teoria_rino: 5000
    vende_transmissao: true
    transmissao_nota: >
      O site diz "transmissoes em tempo real de cirurgias" e que a cirurgia ao
      vivo pode ser assistida do hotel mediante investimento adicional. No
      ciclo anterior isso era PRODUTO VENDIDO: transmissao Face R$ 10 mil,
      transmissao Rino R$ 5 mil, e cadaver lab Face assistido R$ 20 mil.
      CONTRADIZ frontalmente a decisao do kickoff de nao transmitir, que esta
      implementada como veto em src/rules/transmissao-cirurgia.js (R-002).
  plataforma_de_assinatura:
    url: plasticflix.academy
    posicionamento_declarado: "A MAIOR PLATAFORMA DE CIRURGIA PLASTICA FACIAL E RINOPLASTIA DO MUNDO"
    acervo: mais de 250 aulas
    fundador_declarado: Dr. Dhyego Curado
    nota: >
      E a alternativa competitiva A5 do posicionamento — e ela se anuncia com
      superlativo absoluto, o oposto da regua de tom que produzimos.
  site_atual:
    situacao: desatualizado
    gerido_por: ex-profissional "John"
    nota: >
      O acesso ao site atual e um bloqueio (ver lacunas.yaml L-009). A
      reestruturacao das LPs depende dele.

evento:
  nome: Prime
  local: Instituto Quirontec
  cidade: Sao Paulo
  mes: marco
  ano: 2027
  ano_fonte: >
    CONFIRMADO EM FONTE PUBLICA DO PROPRIO CLIENTE em 24/09/2026, nao por
    declaracao a Stark:
      - bio do Instagram @plasticflixbrasil: "Hands on Cadaver Lab Face/Nariz:
        03-07 marco 2027 Sao Paulo/ inscricoes abertas: +55 11 981047813"
      - site plasticflixacademy.com.br: pagina "PRIME 2027"
    O kickoff nunca disse o ano. O cliente ja estava anunciando publicamente.
  ano_nota: >
    Preenchido porque existe fonte publica e oficial, mais forte que indicio.
    Confirmar mesmo assim na reuniao — junto com a divergencia de datas abaixo.
  divergencia_de_datas: >
    O site plasticflixacademy.com.br publica 03 a 05/03 (rino 03-04, face
    04-05). A bio do Instagram e o kickoff dizem 03 a 07/03. Dois canais do
    PROPRIO CLIENTE divergem entre si sobre a duracao do evento.
  semana: primeira semana de marco
  anfiteatro_capacidade_dia: 70
  grade:
    - data: 03/03
      atividade: Aulas teoricas - Rinoplastia
      eixo: rinoplastia
      formato: teorica
      capacidade: 70
      local: anfiteatro
    - data: 04/03
      atividade: Aulas teoricas - Face
      eixo: face
      formato: teorica
      capacidade: 70
      local: anfiteatro
    - data: 05/03
      atividade: Cadaver lab - Rinoplastia
      eixo: rinoplastia
      formato: lab
      capacidade: 5
      proporcao: 1 aluno por peca
    - data: 06/03
      atividade: Cadaver lab - Face
      eixo: face
      formato: lab
      capacidade: 10
      proporcao: 2 alunos por peca
    - data: 07/03
      atividade: Cirurgia ao vivo
      eixo: ambos
      formato: cirurgia_ao_vivo
      capacidade: 4 observadores por cirurgiao operante
      local: null
      local_nota: >
        Hospital em Sao Paulo a definir. Ver lacunas.yaml L-002. Nenhuma peca
        pode nomear o hospital enquanto este campo for null.
  transmissao_de_cirurgia:
    permitida: false
    motivo: >
      Decisao fechada no kickoff. Custo aproximado de R$ 100 mil, risco de
      superlotacao do anfiteatro com nao pagantes e problema de organizacao.
      Nenhuma peca pode prometer assistir a cirurgia fora das 4 vagas
      presenciais por cirurgiao. Ver regra R-002.

objetivos:
  declarado_pelo_cliente: >
    Posicionamento cientifico dos socios - coloca-los no mesmo patamar de
    autoridade dos convidados internacionais. Lucro imediato nao e a meta
    declarada.
  real_do_projeto: >
    Preencher as vagas de Face. As vendas de Face estao zeradas e o risco
    declarado e de R$ 700 a 800 mil de prejuizo no congresso, cerca de
    R$ 150 mil por socio. Este e o numero que a operacao precisa mover.
  risco_financeiro_brl: [700000, 800000]
  risco_por_socio_brl: 150000
  ocupacao_total_a_preencher:
    teoricas: 140
    lab_rino: 5
    lab_face: 10
    observadores_cirurgia: null
  meta_comercial_minima: null
  meta_comercial_nota: >
    Quantas vagas cobrem o custo nao foi dito no kickoff. Confirmar com o
    cliente antes de declarar meta de viabilidade em qualquer documento.

historico:
  - fato: O evento saiu do Rosewood para o Instituto Quirontec
    motivo: cortar custo
  - fato: A Stark ja vendeu o Plasticflix Prime no ano anterior
    nota: >
      Ha conta de anuncios e historico de campanhas anteriores da Stark em
      analise (ver frentes.yaml, F2).
  - fato: Site atual desatualizado, gerido pelo ex-profissional "John"

