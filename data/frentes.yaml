# As cinco frentes de trabalho do Plasticflix Prime.
#
# Cada frente tem objetivo, entregas e criterio de pronto. O criterio de pronto
# existe para que "frente em andamento" signifique a mesma coisa para todo mundo.
#
# Fonte: kickoff 2026-09-22, secao de frentes da Stark.

fonte: kickoff 2026-09-22

frentes:
  - id: F1
    nome: Landing pages
    dono: Gustavo Ferro
    papel_do_dono: estrategista
    objetivo: >
      Duas LPs separadas, uma de Rinoplastia e uma de Face, para evitar confusao
      de publico e otimizar a segmentacao dos anuncios.
    entregas:
      - Nova estrutura da LP de Rinoplastia, com direcionamentos e links de venda
      - Nova estrutura da LP de Face, com direcionamentos e links de venda
      - WhatsApp proprio por LP (numero da Rino a adicionar, com redirecionamento separado)
      - Rodape das duas LPs com a oferta de -10% no combo Rino + Face
      - Checkout direto para as teoricas; fluxo para WhatsApp no lab
      - Esboco estrutural e link de analise enviados a Fran antes de publicar
    criterio_de_pronto: >
      As duas LPs no ar, cada uma com WhatsApp proprio funcionando, checkout de
      teorica ativo, rodape de combo publicado e o link revisado pela Fran ANTES
      da publicacao. Sem o esboco aprovado pela Fran, a LP nao sobe.
    depende_de: [L-003, L-004, L-009]

  - id: F2
    nome: Trafego pago
    dono: Mateus Borgo
    papel_do_dono: gestor de trafego
    objetivo: >
      Testar aquisicao paga em Mexico e Argentina com orcamento travado, e
      voltar com dado para a discussao de orcamento.
    orcamento:
      total_brl: 10000
      periodo_meses: 2
      distribuicao:
        - praca: Mexico
          brl: 5000
        - praca: Argentina
          brl: 5000
      brasil: excluido
      brasil_nota: >
        Sem trafego pago no Brasil nesta fase. Brasil vai por WhatsApp, mala
        direta e sociedades. Ver regra R-003.
      proposta_em_aberto:
        valor_mensal_brl: [15000, 20000]
        proposto_por: Gustavo Ferro
        status: travado pelo Mattioli em R$ 10 mil como teste
        objecao: >
          A Gislaine questiona o retorno de trafego em evento grande. A unica
          forma de destravar a discussao e reabrir ao fim dos 2 meses com dado.
    entregas:
      - Estrutura de trafego inicial configurada (R$ 10 mil / 2 meses, Mexico + Argentina)
      - Destinacao de R$ 5 mil Mexico + R$ 5 mil Argentina
      - Listas de ex-alunos e compradores carregadas como exclusao nas campanhas de captacao
      - Analise da conta de anuncios e do historico de campanhas anteriores da Stark
    criterio_de_pronto: >
      Campanhas rodando nas duas pracas com exclusao de ex-alunos aplicada, e
      expectativa de resultado calibrada POR ESCRITO antes do inicio - senao o
      teste e lido como fracasso do canal.
    depende_de: [L-007]

  - id: F3
    nome: Conteudo e Instagram
    dono: Iris Goncalves
    papel_do_dono: copy
    objetivo: >
      Sustentar o Instagram como etapa intermediaria do funil - onde a objecao
      cai e o corpo docente e apresentado - e provar essa posicao com dado no
      primeiro ciclo.
    cadencia_minima:
      posts_por_semana: 3
    idioma: en
    entregas:
      - Perfil e legendas traduzidos e ajustados para o ingles
      - Carrosseis de apresentacao dos palestrantes
      - Pecas de diferenciais cientificos
      - Peca do instrutor individual por aluno (1 por peca na Rino, 2 na Face)
      - Peca do encadeamento teoria -> lab -> cirurgia
      - Fotos atualizadas de autores e professores subidas ao Drive compartilhado
    criterio_de_pronto: >
      3 posts por semana publicados em ingles, com o corpo docente apresentado e
      a leitura de dado do primeiro ciclo pronta para sustentar (ou derrubar) a
      permanencia do Instagram no percurso.
    depende_de: [L-005]
    tensao_declarada: >
      O cliente queria mandar o anuncio direto para a LP. Gustavo defende manter
      o Instagram no percurso. Num produto de R$ 20 a 60 mil, anuncio direto para
      LP tende a nao converter. Acordo explicito + leitura conjunta do dado. Ver
      regra R-008, que alerta (sem vetar) quando isso aparece.

  - id: F4
    nome: Comercial e base
    dono: Marielly Oliveira
    papel_do_dono: customer success (interface com Fran e Mara)
    objetivo: >
      Fazer a venda ativa sobre base quente acontecer - e o que move a Face no
      curto prazo, antes de qualquer resultado de trafego.
    fluxo_de_fechamento:
      - LP ou anuncio
      - WhatsApp
      - Qualificacao (RQE ou comprovacao de residencia)
      - Proposta
      - Link de pagamento gerado pela Mara
    entregas:
      - Planilha dos 22 leads repassada da Mara para a Fran
      - Negociacao individual dos 22 leads antes de qualquer mexida publica de preco
      - Listas de contatos e e-mails de ex-alunos compartilhadas
      - Link de pagamento solicitado, gerado e encaminhado
    criterio_de_pronto: >
      Os 22 leads contatados com desfecho registrado, base de ex-alunos na mao
      da Stark, e link de pagamento funcionando por produto.
    depende_de: [L-003, L-007]

  - id: F5
    nome: Parcerias e mailing
    dono: Cliente (com apoio da Stark)
    papel_do_dono: cliente
    objetivo: >
      Abrir canal com as sociedades medicas - que e o substituto do trafego pago
      no Brasil e a porta de entrada nas pracas latinas.
    entregas:
      - Mailing da Sociedade Brasileira de Otorrinolaringologia via Renato, entregue a Gislaine
      - Mailings das sociedades de otorrino e plastica da Argentina e Venezuela cobrados
      - Acordos de -10% para membros em troca de divulgacao nos sites oficiais (AR, CL, VE, MX)
    criterio_de_pronto: >
      Pelo menos um mailing na mao e um acordo de -10% assinado com
      contrapartida de divulgacao publicada no site da sociedade.
    depende_de: [L-006]

  - id: F6
    nome: Materiais e impressos do evento
    dono: a definir
    papel_do_dono: stark
    objetivo: >
      Produzir o material do dia do evento - impressos, sinalizacao,
      certificados, cracha, papelaria do participante, patrocinadores e
      templates de slides.
    origem: >
      Esta frente NAO veio do kickoff. Veio do inventario do ciclo anterior,
      levantado na pasta Plasticflix Academy do Drive em 24/09/2026. A reuniao
      tratou de LP, trafego, conteudo, comercial e parcerias; o ciclo anterior
      produziu mais de 40 itens, a maioria de material de evento. Sem esta
      frente o maior volume de trabalho do projeto ficaria invisivel ate a reta
      final.
    entregas:
      - Certificados e credenciais (certificados por perfil, crachas, cordao, tickets, assinaturas dos chairs)
      - Impressos e sinalizacao (backdrop, placas de mesa, sinalizacao, CadaverLab, instrutores, transfer, placa-trofeu, estande, rollup)
      - Papelaria do participante (carta de boas-vindas, envelope A4, agenda A5, cartao de agradecimento, tag de caixa)
      - Programacao e slides (cronogramas por eixo, programacao teorica, template de slides, slides dos palestrantes, QR code)
      - Patrocinadores (PDF de cotas, patrocinados por eixo, banner do site da Cenacon)
      - Identidade visual da edicao (logo vetorizado com o numero da edicao, QR code)
      - Videos e pecas recorrentes (video atracao, videos dos palestrantes, reels, #EUVOU, enews, contagem regressiva)
    criterio_de_pronto: >
      Todos os materiais aprovados pelo cliente e enviados ao fornecedor dentro
      do prazo de impressao.
    quando_abre: >
      No ciclo anterior certificados, crachas e patrocinadores foram produzidos
      entre novembro e fevereiro para um evento de marco. Contando para tras,
      esta frente abre por volta de novembro - antes da fase de lote 1.
    depende_de: [L-010, L-011, L-005]
    clickup: 86akpdz99

  # F7 a F11 sao as frentes de GESTAO, modeladas nas frentes equivalentes da
  # OpenMind 2026 (task-mae 86ahzc7ym). O kickoff so produziu frentes de
  # execucao; sem estas, o projeto nao tem onde registrar decisao, cobranca,
  # data nem aprovacao — que foi o que produziu a reta final da Jornada
  # Paulista e o retrabalho de 40 pecas na OpenMind.

  - id: F7
    nome: Estrategia e modelo de vendas
    dono: a definir
    papel_do_dono: stark
    espelha: 86ahzc83k
    objetivo: >
      Fechar com o cliente a regua comercial que hoje esta meio definida: dois
      lotes existem sem data de corte, e o piso da Face so existe na conversa.
    entregas:
      - Datas de corte do 1o e do 2o lote, iguais em LP, WhatsApp e comercial
      - Piso de negociacao da Face definido pela diretoria
      - Expectativa do trafego calibrada por escrito antes da primeira campanha
      - Apresentacao em caminhos possiveis, nao mega-plano
    criterio_de_pronto: >
      Regua de lote com datas declaradas, piso da Face definido e calibragem de
      trafego escrita — tudo documentado e identico nos tres canais.
    depende_de: [L-001, L-004, L-008]
    clickup: 86akpf9jr

  - id: F8
    nome: Destravar dependencias do cliente
    dono: a definir
    papel_do_dono: stark
    espelha: 86ahzc86k
    objetivo: >
      Cobrar e destravar as 11 lacunas registradas. E o gargalo que travou a
      Jornada Paulista e a OpenMind na reta final.
    entregas:
      - Cobranca agrupada dos dados que travam data e identidade
      - Corpo docente confirmado e fotos no Drive
      - Acesso ao site atual e medidas do Quirontec
    criterio_de_pronto: >
      As 11 lacunas fechadas ou explicitamente aceitas como risco, sem trava
      pendente nao sinalizada.
    regra: >
      Uma mensagem com todos os itens, nunca pedido pingado, e sempre com o que
      segue mesmo assim. A tool status_lacunas gera o rascunho e omite o que e
      acao interna da Stark.
    depende_de: []
    clickup: 86akpf9kt

  - id: F9
    nome: Gestao da comunicacao e entregas
    dono: a definir
    papel_do_dono: stark
    espelha: 86ahzc84v
    objetivo: >
      Definir como a Stark fala com o cliente, como registra aprovacao e como
      evita o desgaste das edicoes anteriores.
    entregas:
      - Porta-voz unico e canal oficial definidos
      - Ritual de alinhamento semanal de 15 a 30 minutos
      - Fluxo de aprovacao por tipo de peca
    criterio_de_pronto: >
      Porta-voz definido, ritual rodando e toda aprovacao registrada em lugar
      rastreavel.
    nota: >
      O cliente tem quatro interlocutores com dominios diferentes. Sem
      porta-voz, a Stark recebe quatro versoes da mesma decisao.
    depende_de: []
    clickup: 86akpf9mg

  - id: F10
    nome: Cronograma
    dono: a definir
    papel_do_dono: stark
    espelha: 86aj7hhyz
    objetivo: >
      Converter as sete fases em datas reais, contadas para tras a partir do
      evento, e amarrar o prazo de grafica.
    entregas:
      - Sete fases com janela declarada
      - Calendario de producao de materiais aberto em novembro
      - Prazo de grafica como data real, nao estimativa
    criterio_de_pronto: >
      Cada frente sabe o que precisa estar pronto em qual data.
    depende_de: [L-001]
    clickup: 86akpf9nw

  - id: F11
    nome: Preparar e integrar o squad
    dono: a definir
    papel_do_dono: stark
    espelha: 86ahzc872
    objetivo: >
      Colocar o time para rodar com o mesmo contexto e com a ferramenta do
      projeto na mao.
    entregas:
      - Dona do projeto no ClickUp definida
      - Time com acesso a documentacao, a arvore de tasks e ao MCP
      - Os dois erros mais provaveis avisados na largada
    criterio_de_pronto: >
      Dona definida e time produzindo com perfil_plasticflix no inicio e
      verificar_conteudo no fim.
    nota: >
      A dona do projeto e a unica pendencia bloqueante que nao depende do
      cliente.
    depende_de: []
    clickup: 86akpf9pw

  - id: F12
    nome: Ideacao, narrativa e identidade da campanha
    dono: a definir
    papel_do_dono: stark
    objetivo: >
      Definir o que o projeto DIZ: posicionamento, big idea, arco narrativo,
      mote, manifesto, regua de tom e banco de hooks.
    origem: >
      O kickoff tratou de canais, precos e listas, e nao tocou no que o projeto
      diz. Na OpenMind isso foi metade do trabalho: o mote passou por quatro
      versoes e a primeira reprovacao chegou com 40 pecas ja produzidas.
    entregas:
      - Posicionamento contra as alternativas competitivas reais
      - Big idea afirmativa, sem inimigo declarado
      - Arco narrativo em atos
      - Mote e assinatura de campanha
      - Manifesto
      - Regua de tom, cada regra nascida de um defeito concreto
      - Banco de hooks por fase e por prova
    criterio_de_pronto: >
      Conceito aprovado pelo cliente ANTES de a campanha ser produzida.
    regra: >
      Uma prova por peca. Conceito antes de volume, nunca o contrario.
    depende_de: [L-013]
    clickup: 86akpfjh7

  - id: F13
    nome: Patrocinio e receita que nao depende de vaga
    dono: a definir
    papel_do_dono: stark
    objetivo: >
      Abrir a frente de patrocinio: cotas, material de prospeccao, prospectos
      mapeados e contrato assinado.
    origem: >
      O kickoff nao tocou no assunto. Veio do inventario do Drive, que mostrou
      patrocinio ativo no ciclo anterior — pasta Patrocinadores, PDF de cotas,
      artes por eixo (Metodo LD) e banner no site da Cenacon.
    razao_de_prioridade: >
      E receita que NAO depende de preencher vaga. O projeto tem a Face zerada e
      risco de R$ 700 a 800 mil, e toda a conversa do kickoff girou em vender
      inscricao para um publico que o proprio cliente descreve como sem poder
      aquisitivo, num mercado que ele descreve como saturado. Patrocinio ataca o
      mesmo buraco por outro lado, e a negociacao e com empresa, nao com medico.
    entregas:
      - Mapeamento de quem patrocinou o ciclo anterior
      - Cotas definidas, com o que cada uma entrega
      - PDF de cotas e material de prospeccao (as pecas ficam na F6)
      - Prospectos mapeados na industria que vende para o publico
    criterio_de_pronto: >
      Primeiro contrato assinado.
    argumento_de_venda: >
      Nao e volume: sao 70 pessoas por dia. E qualificacao — cirurgioes
      plasticos e otorrinos com RQE, tomadores de decisao de compra, reunidos
      cinco dias. Para quem vende implante ou tecnologia, essa sala vale mais
      que um congresso de mil pessoas.
    decisoes_do_cliente:
      - Se patrocinio entra neste ciclo
      - Quem prospecta (Stark, Cenacon ou os socios pela rede deles)
      - Quais cotas e se ha exclusividade por categoria
    depende_de: []
    clickup: 86akpfjkn
